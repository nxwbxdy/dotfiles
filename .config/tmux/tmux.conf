# join-pane -s :0.2 -t 1 # joins pane 2 from window 0 to window 1
# join-pane -s :0.2 -t 1 -h # joins pane 2 from window 0 to window 1 horizontal split

#set default-shell "nix-shell -i bash"
#set-option -ga terminal-overrides ",xterm-256color:Tc"
# set -g default-terminal "xterm-256color"
set-option -g default-terminal "tmux-256color"
#set -ga terminal-overrides ',xterm-256color:Tc'

set -s escape-time 0
set-option -g history-limit 20000

set -g status-style 'bg=default fg=white'
set -g status-right "#(uptime | cut -f 4-5 -d ' ' | cut -f 1 -d ',')"
set -g status-left "[#S] "

unbind C-b
set -g prefix C-space
set-option -g bell-action none 

unbind c
unbind %
unbind '"'
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf

setw -g mode-keys vi
set -g base-index 1
set -g mouse on
bind-key ` last-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-\' resize-pane -R 5

bind-key b set-option status

bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel wl-copy # now for wsl # then: #wl-copy
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'

bind-key f run-shell "tmux neww ~/.scripts/tmux/fzf_session"
bind-key g run-shell "tmux neww ~/.scripts/tmux/fzf_window"
set-option -g focus-events on
set-option -g renumber-windows on

#bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

set-option -g status-position top

